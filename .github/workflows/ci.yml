# Maintained for this repository's TypeScript target.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install locked dependencies
        working-directory: ts
        run: npm ci --no-audit --no-fund
      - name: Build and run generated tests
        working-directory: ts
        run: npm test
      - name: Check API contracts
        run: node --test "checks/*.test.cjs"
      - name: Check consumer types
        run: node ts/node_modules/typescript/bin/tsc --strict --noEmit --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext checks/api-types.ts
      - name: Pack the built SDK
        working-directory: ts
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-artifact
        run: |
          node -e "require('node:fs').mkdirSync(process.env.PACKAGE_DIR,{recursive:true})"
          npm pack --json --ignore-scripts --pack-destination "$PACKAGE_DIR" > "$PACKAGE_DIR/pack.json"
      - name: Check the distributable independently of the source tree
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-artifact
        run: node checks/package-artifact.cjs "$PACKAGE_DIR/pack.json"
