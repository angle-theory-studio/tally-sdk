# Maintained for this repository. Manual verification packs and tests the
# distributable; optional publication consumes that exact immutable artifact.
# Configure npm trusted publishing for this repository and this workflow filename
# before choosing publish=true. No npm credentials are needed for verification.
name: publish-ts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified tarball to npm and create its Git tag'
        type: boolean
        default: false
      expect_sha:
        description: 'Optional expected commit SHA for this main-branch run'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify the selected ref
        env:
          EXPECT: ${{ inputs.expect_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [ -n "$EXPECT" ]; then test "$EXPECT" = "$GITHUB_SHA"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: ts
        run: npm ci --no-audit --no-fund
      - name: Build and run generated tests
        working-directory: ts
        run: npm test
      - name: Check API contracts
        run: node --test "checks/*.test.cjs"
      - name: Check consumer types
        run: node ts/node_modules/typescript/bin/tsc --strict --noEmit --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext checks/api-types.ts
      - name: Pack the built SDK
        working-directory: ts
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-artifact
        run: |
          node -e "require('node:fs').mkdirSync(process.env.PACKAGE_DIR,{recursive:true})"
          npm pack --json --ignore-scripts --pack-destination "$PACKAGE_DIR" > "$PACKAGE_DIR/pack.json"
      - name: Verify the actual tarball
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-artifact
        run: node checks/package-artifact.cjs "$PACKAGE_DIR/pack.json"
      - name: Save the verified Linux tarball
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true # A retried verification replaces its previous artifact.

  publish:
    name: Publish verified tarball
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      # No checkout, project dependencies or project scripts in this job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install a pinned OIDC-capable npm
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: artifact
      - name: Verify integrity and registry version
        id: package
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          const records = JSON.parse(fs.readFileSync('artifact/pack.json', 'utf8'))
          assert.equal(records.length, 1)
          const packed = records[0]
          assert.equal(packed.name, '@angle-theory-studio/tally-sdk')
          assert.match(packed.filename, /^[a-zA-Z0-9._-]+\.tgz$/)
          assert.match(packed.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/)
          const bytes = fs.readFileSync('artifact/' + packed.filename)
          const integrity = 'sha512-' + crypto.createHash('sha512').update(bytes).digest('base64')
          assert.equal(integrity, packed.integrity, 'downloaded tarball differs from the verified package')
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(packed.name) + '/' + encodeURIComponent(packed.version))
          let published = false
          if (response.ok) {
            const existing = await response.json()
            assert.equal(existing.dist?.integrity, integrity, 'this version already exists with different contents')
            published = true
          } else {
            assert.equal(response.status, 404, 'registry lookup failed; refusing to treat it as an unpublished version')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${packed.filename}\nversion=${packed.version}\npublished=${published}\n`)
          NODE
      - name: Publish the verified tarball
        if: steps.package.outputs.published == 'false'
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: npm publish "artifact/$PACKAGE_FILE" --access public --ignore-scripts

  tag:
    name: Tag the published commit
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create or verify the release tag
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          EXISTING="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
